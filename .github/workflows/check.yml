name: 動作チェック

# 音声デバイスのない CI では実際の再生や録音は試せないので、
# 「壊れた状態で push されていないか」までを見る。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 読み込みと構文の確認
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: システムの依存を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 python3-tk

      - name: Python の依存を入れる
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 構文を確認する
        run: python -m compileall -q .

      - name: すべてのモジュールを読み込む
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "platform_support", "comutil", "config", "devices",
              "mic_chain", "router", "player", "music_search",
              "separator", "vst_editor_host", "cli", "app",
          ]
          for name in modules:
              importlib.import_module(name)
              print(f"OK  {name}")
          PY

      - name: OS 分岐が Linux でも通るか
        run: |
          python - <<'PY'
          import platform_support as ps

          assert not ps.WINDOWS, "Linux のはずが Windows と判定された"
          print("設定の保存先:", ps.app_data_dir())
          print("キャッシュ:", ps.cache_dir())
          print("Host API:", ps.host_api_names(), "->", ps.default_host_api())
          print("プラグイン探索先:", ps.plugin_dirs())
          assert not any("%" in d for d in ps.plugin_dirs()), "未展開の環境変数が残っている"

          import devices
          assert devices.system_status() == {}, "Linux で Windows 専用の取得が走っている"

          import separator
          cap = separator.capability()
          print("ボーカル除去:", cap.summary)
          assert not cap.available, "CI に GPU は無いので使えない判定になるはず"
          PY
