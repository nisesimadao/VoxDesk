name: リリースを作る

# v1.0.0 のようなタグを push すると、各 OS 向けの配布物を作ってリリースに並べる。
# 手動実行もできる（試しに作りたいとき用）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "バージョン（例: 0.1.0-test）"
        required: true
        default: "0.0.0-test"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }} 向けをビルド
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: windows
          - os: macos-15
            label: macOS (Apple Silicon)
            artifact: macos-arm64
          - os: macos-15-intel
            label: macOS (Intel)
            artifact: macos-x86_64
          - os: ubuntu-22.04
            label: Linux
            artifact: linux

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: バージョンを決める
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Linux の依存を入れる
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 python3-tk

      - name: Python の依存を入れる
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: 実行ファイルを作る
        run: pyinstaller --noconfirm --clean packaging/KaraokeStudio.spec

      # ---------- Windows: インストーラ ----------
      - name: Inno Setup を入れる
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: インストーラを作る
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.value }} packaging\installer.iss

      # ---------- macOS: dmg ----------
      - name: dmg を作る
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg dist/installer
          cp -R "dist/KaraokeStudio.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "カラオケスタジオ" -srcfolder dmg -ov -format UDZO \
            "dist/installer/KaraokeStudio-${{ steps.version.outputs.value }}-${{ matrix.artifact }}.dmg"

      # ---------- Linux: tar.gz ----------
      - name: tar.gz を作る
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/installer
          # 凍結ビルドなので start.sh（仮想環境を作る用）は入れない
          cp README.md dist/KaraokeStudio/
          chmod +x dist/KaraokeStudio/KaraokeStudio
          tar czf "dist/installer/KaraokeStudio-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz" \
            -C dist KaraokeStudio

      - name: 配布物を保存する
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/installer/*
          if-no-files-found: error

  release:
    name: リリースに並べる
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 中身を確認する
        run: ls -lhR artifacts

      - name: リリースを作る
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: カラオケスタジオ ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            ## インストール

            | OS | ファイル | 手順 |
            |---|---|---|
            | Windows | `*-windows-x64-setup.exe` | 実行してインストール |
            | macOS (Apple Silicon) | `*-macos-arm64.dmg` | 開いて Applications へドラッグ |
            | macOS (Intel) | `*-macos-x86_64.dmg` | 同上 |
            | Linux | `*-linux-x86_64.tar.gz` | 展開して `./KaraokeStudio` |

            ### macOS で「開発元を確認できない」と出たら

            署名していないため Gatekeeper に止められます。
            アプリを右クリック →「開く」を選ぶか、次を実行してください。

            ```
            xattr -dr com.apple.quarantine /Applications/KaraokeStudio.app
            ```

            ### Linux で音が出ないとき

            `sudo apt install libportaudio2` が必要です。

            ### ボーカル除去について

            容量の都合で、AI によるボーカル除去（torch / demucs、約 3 GB）は同梱していません。
            必要な場合はソースから導入してください（README を参照）。
